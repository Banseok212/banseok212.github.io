<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="dot"></span>{{ site.title }}</a>
    <nav aria-label="Main">
      {% for item in site.nav %}
        {% assign active = false %}
        {% if item.url == '/' and page.url == '/' %}{% assign active = true %}
        {% elsif item.url != '/' and page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode">◐</button>
  </div>
</header>
